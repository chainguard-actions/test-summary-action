name: Test show=all option with glob paths
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple JUnit XML test files
        run: |
          mkdir -p tests/results/suite-a tests/results/suite-b
          cat > tests/results/suite-a/TEST-a.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite name="SuiteA" tests="2" failures="0" errors="0" skipped="1" time="0.300">
            <testcase name="test_a1" classname="com.example.SuiteA" time="0.100"/>
            <testcase name="test_a2" classname="com.example.SuiteA" time="0.000">
              <skipped/>
            </testcase>
          </testsuite>
          EOF
          cat > tests/results/suite-b/TEST-b.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite name="SuiteB" tests="3" failures="1" errors="0" skipped="0" time="0.600">
            <testcase name="test_b1" classname="com.example.SuiteB" time="0.100"/>
            <testcase name="test_b2" classname="com.example.SuiteB" time="0.200"/>
            <testcase name="test_b3" classname="com.example.SuiteB" time="0.300">
              <failure message="Assertion failed">Assertion failed</failure>
            </testcase>
          </testsuite>
          EOF

      - id: action
        uses: .
        with:
          paths: "tests/results/**/TEST-*.xml"
          show: "all"
          output: tests/results/summary-all.md

      - name: Assert passed count (combined suites)
        env:
          PASSED: ${{ steps.action.outputs.passed }}
        run: |
          echo "passed: $PASSED"
          if [ "$PASSED" != "3" ]; then
            echo "FAIL: expected passed=3, got '$PASSED'"
            exit 1
          fi
          echo "PASS"

      - name: Assert failed count (combined suites)
        env:
          FAILED: ${{ steps.action.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          if [ "$FAILED" != "1" ]; then
            echo "FAIL: expected failed=1, got '$FAILED'"
            exit 1
          fi
          echo "PASS"

      - name: Assert skipped count (combined suites)
        env:
          SKIPPED: ${{ steps.action.outputs.skipped }}
        run: |
          echo "skipped: $SKIPPED"
          if [ "$SKIPPED" != "1" ]; then
            echo "FAIL: expected skipped=1, got '$SKIPPED'"
            exit 1
          fi
          echo "PASS"

      - name: Assert total count (combined suites)
        env:
          TOTAL: ${{ steps.action.outputs.total }}
        run: |
          echo "total: $TOTAL"
          if [ "$TOTAL" != "5" ]; then
            echo "FAIL: expected total=5, got '$TOTAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert output file was created
        run: |
          if [ ! -f "tests/results/summary-all.md" ]; then
            echo "FAIL: output file was not created"
            exit 1
          fi
          echo "PASS: output file exists"
