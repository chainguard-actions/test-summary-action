name: Test show input with all results
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          paths: actions/hardened/test-summary--action/v2.4/tests/fixtures/results/TEST-example.xml
          show: "all"
          output: /tmp/test-summary-show-all.md
      - name: Assert output file was created
        run: |
          echo "Checking if output file exists..."
          if [ ! -f /tmp/test-summary-show-all.md ]; then
            echo "FAIL: output file /tmp/test-summary-show-all.md was not created"
            exit 1
          fi
          echo "Output file contents:"
          cat /tmp/test-summary-show-all.md
          echo "PASS: output file exists"
      - name: Assert total count is correct
        env:
          TOTAL: ${{ steps.action.outputs.total }}
        run: |
          echo "total: $TOTAL"
          if [ "$TOTAL" != "4" ]; then
            echo "FAIL: expected total to be 4, got '$TOTAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert passed count is correct
        env:
          PASSED: ${{ steps.action.outputs.passed }}
        run: |
          echo "passed: $PASSED"
          if [ "$PASSED" != "2" ]; then
            echo "FAIL: expected passed to be 2, got '$PASSED'"
            exit 1
          fi
          echo "PASS"
      - name: Assert failed count is correct
        env:
          FAILED: ${{ steps.action.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          if [ "$FAILED" != "1" ]; then
            echo "FAIL: expected failed to be 1, got '$FAILED'"
            exit 1
          fi
          echo "PASS"
      - name: Assert skipped count is correct
        env:
          SKIPPED: ${{ steps.action.outputs.skipped }}
        run: |
          echo "skipped: $SKIPPED"
          if [ "$SKIPPED" != "1" ]; then
            echo "FAIL: expected skipped to be 1, got '$SKIPPED'"
            exit 1
          fi
          echo "PASS"
