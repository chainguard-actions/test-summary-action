name: Test show=all option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          paths: tests/fixtures/junit-passing.xml
          show: all
          output: /tmp/test-summary-all.md
      - name: Assert output file was created
        run: |
          if [ ! -f /tmp/test-summary-all.md ]; then
            echo "FAIL: output file /tmp/test-summary-all.md was not created"
            exit 1
          fi
          echo "PASS: output file exists"
      - name: Assert output file contains test names (show=all includes passing tests)
        run: |
          echo "Output file contents:"
          cat /tmp/test-summary-all.md
          # With show=all, the table should include passing test names
          if ! grep -q "testOne\|testTwo\|testThree\|test" /tmp/test-summary-all.md; then
            echo "FAIL: output file does not contain test names (show=all should include all tests)"
            exit 1
          fi
          echo "PASS: output file contains test names"
      - name: Assert passed output
        env:
          PASSED: ${{ steps.action.outputs.passed }}
        run: |
          echo "passed: $PASSED"
          if [ "$PASSED" != "3" ]; then
            echo "FAIL: expected passed=3, got '$PASSED'"
            exit 1
          fi
          echo "PASS"
