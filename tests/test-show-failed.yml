name: Test show failed tests only
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          paths: tests/fixtures/junit-mixed.xml
          output: /tmp/failed-summary.md
          show: "fail"
      - name: Assert output file contains failed test info
        run: |
          echo "Checking output file for failed tests..."
          if [ ! -f /tmp/failed-summary.md ]; then
            echo "FAIL: output file /tmp/failed-summary.md was not created"
            exit 1
          fi
          echo "Failed tests output file contents:"
          cat /tmp/failed-summary.md
          echo ""
          if [ ! -s /tmp/failed-summary.md ]; then
            echo "FAIL: output file is empty"
            exit 1
          fi
          echo "PASS: show=fail processed successfully"
