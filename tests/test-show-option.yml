name: Test show option to filter displayed test types
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          paths: tests/fixtures/junit-mixed.xml
          show: fail
          output: /tmp/test-summary-fail-only.md

      - name: Assert action succeeded and outputs are set
        env:
          PASSED: ${{ steps.action.outputs.passed }}
          FAILED: ${{ steps.action.outputs.failed }}
          TOTAL: ${{ steps.action.outputs.total }}
        run: |
          echo "passed: $PASSED"
          echo "failed: $FAILED"
          echo "total: $TOTAL"
          if [ -z "$TOTAL" ]; then
            echo "FAIL: total output is empty"
            exit 1
          fi
          if [ "$FAILED" != "1" ]; then
            echo "FAIL: expected failed=1, got '$FAILED'"
            exit 1
          fi
          echo "PASS: outputs are correct"

      - name: Assert output file was created
        run: |
          if [ ! -f /tmp/test-summary-fail-only.md ]; then
            echo "FAIL: output file was not created"
            exit 1
          fi
          echo "PASS: output file exists"
