name: Test show option input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          paths: "${{ github.workspace }}/actions/hardened/test-summary--action/v2.0/tests/fixtures/junit-results.xml"
          show: "fail"
          output: "/tmp/test-summary-show-fail.md"
      - name: Assert output file was created with show=fail
        run: |
          echo "Checking that output file was created at /tmp/test-summary-show-fail.md"
          if [ ! -f "/tmp/test-summary-show-fail.md" ]; then
            echo "FAIL: output file was not created"
            exit 1
          fi
          echo "Output file contents:"
          cat /tmp/test-summary-show-fail.md
          echo "PASS: output file exists with show=fail option"
