name: Test basic JUnit XML with passing tests
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create JUnit XML with passing tests
        run: |
          mkdir -p tests/results
          cat > tests/results/TEST-passing.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite name="PassingSuite" tests="3" failures="0" errors="0" skipped="0" time="1.234">
            <testcase name="test_one" classname="com.example.TestClass" time="0.100"/>
            <testcase name="test_two" classname="com.example.TestClass" time="0.200"/>
            <testcase name="test_three" classname="com.example.TestClass" time="0.300"/>
          </testsuite>
          EOF

      - id: action
        uses: .
        with:
          paths: tests/results/TEST-passing.xml

      - name: Assert passed count
        env:
          PASSED: ${{ steps.action.outputs.passed }}
        run: |
          echo "passed: $PASSED"
          if [ "$PASSED" != "3" ]; then
            echo "FAIL: expected passed=3, got '$PASSED'"
            exit 1
          fi
          echo "PASS"

      - name: Assert failed count
        env:
          FAILED: ${{ steps.action.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          if [ "$FAILED" != "0" ]; then
            echo "FAIL: expected failed=0, got '$FAILED'"
            exit 1
          fi
          echo "PASS"

      - name: Assert skipped count
        env:
          SKIPPED: ${{ steps.action.outputs.skipped }}
        run: |
          echo "skipped: $SKIPPED"
          if [ "$SKIPPED" != "0" ]; then
            echo "FAIL: expected skipped=0, got '$SKIPPED'"
            exit 1
          fi
          echo "PASS"

      - name: Assert total count
        env:
          TOTAL: ${{ steps.action.outputs.total }}
        run: |
          echo "total: $TOTAL"
          if [ "$TOTAL" != "3" ]; then
            echo "FAIL: expected total=3, got '$TOTAL'"
            exit 1
          fi
          echo "PASS"
