name: Test TAP format input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create TAP test file
        run: |
          mkdir -p tests/results
          cat > tests/results/results.tap << 'EOF'
          TAP version 13
          1..4
          ok 1 - first test passes
          ok 2 - second test passes
          not ok 3 - third test fails
            ---
            message: 'Expected value to be 42 but got 0'
            severity: fail
            ...
          ok 4 - fourth test passes # SKIP not implemented yet
          EOF

      - id: action
        uses: .
        with:
          paths: tests/results/results.tap

      - name: Assert passed count
        env:
          PASSED: ${{ steps.action.outputs.passed }}
        run: |
          echo "passed: $PASSED"
          if [ "$PASSED" != "2" ]; then
            echo "FAIL: expected passed=2, got '$PASSED'"
            exit 1
          fi
          echo "PASS"

      - name: Assert failed count
        env:
          FAILED: ${{ steps.action.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          if [ "$FAILED" != "1" ]; then
            echo "FAIL: expected failed=1, got '$FAILED'"
            exit 1
          fi
          echo "PASS"

      - name: Assert skipped count
        env:
          SKIPPED: ${{ steps.action.outputs.skipped }}
        run: |
          echo "skipped: $SKIPPED"
          if [ "$SKIPPED" != "1" ]; then
            echo "FAIL: expected skipped=1, got '$SKIPPED'"
            exit 1
          fi
          echo "PASS"

      - name: Assert total count
        env:
          TOTAL: ${{ steps.action.outputs.total }}
        run: |
          echo "total: $TOTAL"
          if [ "$TOTAL" != "4" ]; then
            echo "FAIL: expected total=4, got '$TOTAL'"
            exit 1
          fi
          echo "PASS"
