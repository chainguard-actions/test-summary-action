name: Test TAP format input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          paths: tests/fixtures/results.tap

      - name: Assert total count is non-zero
        env:
          TOTAL: ${{ steps.action.outputs.total }}
        run: |
          echo "total: $TOTAL"
          if [ -z "$TOTAL" ] || [ "$TOTAL" -eq 0 ]; then
            echo "FAIL: expected total > 0, got '$TOTAL'"
            exit 1
          fi
          echo "PASS: total=$TOTAL"

      - name: Assert passed count is non-zero
        env:
          PASSED: ${{ steps.action.outputs.passed }}
        run: |
          echo "passed: $PASSED"
          if [ -z "$PASSED" ] || [ "$PASSED" -eq 0 ]; then
            echo "FAIL: expected passed > 0, got '$PASSED'"
            exit 1
          fi
          echo "PASS: passed=$PASSED"

      - name: Assert failed count
        env:
          FAILED: ${{ steps.action.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          if [ "$FAILED" != "1" ]; then
            echo "FAIL: expected failed=1, got '$FAILED'"
            exit 1
          fi
          echo "PASS"
