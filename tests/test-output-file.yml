name: Test output file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          paths: "${{ github.workspace }}/actions/hardened/test-summary--action/v2.1/tests/fixtures/TEST-results.xml"
          output: "${{ github.workspace }}/test-summary-output.md"
      - name: Assert output file was created
        run: |
          OUTPUT_FILE="${GITHUB_WORKSPACE}/test-summary-output.md"
          echo "Checking for output file: $OUTPUT_FILE"
          if [ ! -f "$OUTPUT_FILE" ]; then
            echo "FAIL: output file was not created at $OUTPUT_FILE"
            exit 1
          fi
          echo "Output file contents:"
          cat "$OUTPUT_FILE"
          echo "PASS: output file exists"
      - name: Assert output file contains markdown content
        run: |
          OUTPUT_FILE="${GITHUB_WORKSPACE}/test-summary-output.md"
          if ! grep -q "." "$OUTPUT_FILE"; then
            echo "FAIL: output file is empty"
            exit 1
          fi
          echo "PASS: output file has content"
