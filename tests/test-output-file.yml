name: Test output file generation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          paths: tests/fixtures/junit-mixed.xml
          output: /tmp/test-summary.md
      - name: Assert output file was created
        run: |
          echo "Checking output file exists..."
          if [ ! -f /tmp/test-summary.md ]; then
            echo "FAIL: output file /tmp/test-summary.md was not created"
            exit 1
          fi
          echo "Output file contents:"
          cat /tmp/test-summary.md
          echo ""
          # Verify the file has some content (markdown summary)
          if [ ! -s /tmp/test-summary.md ]; then
            echo "FAIL: output file is empty"
            exit 1
          fi
          echo "PASS: output file was created with content"
