name: Test output file generation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          paths: tests/fixtures/junit-passing.xml
          output: /tmp/test-summary.md
      - name: Assert output file was created
        run: |
          echo "Checking output file exists..."
          if [ ! -f /tmp/test-summary.md ]; then
            echo "FAIL: output file /tmp/test-summary.md was not created"
            exit 1
          fi
          echo "PASS: output file exists"
      - name: Assert output file is non-empty
        run: |
          SIZE=$(wc -c < /tmp/test-summary.md)
          echo "output file size: $SIZE bytes"
          if [ "$SIZE" -eq 0 ]; then
            echo "FAIL: output file is empty"
            exit 1
          fi
          echo "PASS: output file has content"
      - name: Assert output file contains markdown
        run: |
          echo "Output file contents:"
          cat /tmp/test-summary.md
          # Should contain some markdown content (numbers or test info)
          if ! grep -qE '[0-9]' /tmp/test-summary.md; then
            echo "FAIL: output file does not appear to contain test summary data"
            exit 1
          fi
          echo "PASS: output file contains expected content"
      - name: Assert passed output is still set
        env:
          PASSED: ${{ steps.action.outputs.passed }}
        run: |
          echo "passed: $PASSED"
          if [ "$PASSED" != "3" ]; then
            echo "FAIL: expected passed=3, got '$PASSED'"
            exit 1
          fi
          echo "PASS"
