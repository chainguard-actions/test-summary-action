name: Test output file generation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          paths: actions/hardened/test-summary--action/v2.4/tests/fixtures/results/TEST-example.xml
          output: /tmp/test-summary-output.md
      - name: Assert output file was created
        run: |
          echo "Checking if output file exists..."
          if [ ! -f /tmp/test-summary-output.md ]; then
            echo "FAIL: output file /tmp/test-summary-output.md was not created"
            exit 1
          fi
          echo "Output file contents:"
          cat /tmp/test-summary-output.md
          echo "PASS: output file exists"
      - name: Assert output file is non-empty
        run: |
          SIZE=$(wc -c < /tmp/test-summary-output.md)
          echo "output file size: $SIZE bytes"
          if [ "$SIZE" -eq 0 ]; then
            echo "FAIL: output file is empty"
            exit 1
          fi
          echo "PASS"
