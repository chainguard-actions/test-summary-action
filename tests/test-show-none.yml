name: Test show=none option (suppress test table)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          paths: tests/fixtures/junit-passing.xml
          show: none
          output: /tmp/test-summary-none.md
      - name: Assert output file was created
        run: |
          if [ ! -f /tmp/test-summary-none.md ]; then
            echo "FAIL: output file /tmp/test-summary-none.md was not created"
            exit 1
          fi
          echo "PASS: output file exists"
      - name: Assert outputs are set correctly
        env:
          PASSED: ${{ steps.action.outputs.passed }}
          FAILED: ${{ steps.action.outputs.failed }}
          TOTAL: ${{ steps.action.outputs.total }}
        run: |
          echo "passed: $PASSED"
          echo "failed: $FAILED"
          echo "total: $TOTAL"
          if [ "$PASSED" != "3" ]; then
            echo "FAIL: expected passed=3, got '$PASSED'"
            exit 1
          fi
          if [ "$FAILED" != "0" ]; then
            echo "FAIL: expected failed=0, got '$FAILED'"
            exit 1
          fi
          if [ "$TOTAL" != "3" ]; then
            echo "FAIL: expected total=3, got '$TOTAL'"
            exit 1
          fi
          echo "PASS: all outputs correct"
      - name: Assert output file has summary but no detailed table
        run: |
          echo "Output file contents:"
          cat /tmp/test-summary-none.md
          # With show=none, individual test names should NOT appear in the table
          # but the summary (counts) should still be present
          if grep -q "testOne\|testTwo\|testThree" /tmp/test-summary-none.md; then
            echo "FAIL: output file contains individual test names (show=none should suppress table)"
            exit 1
          fi
          echo "PASS: output file does not contain individual test names"
